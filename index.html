
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>

    <link rel="icon" href="https://c.top4top.io/p_3948hewu71.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            position: fixed;
            inset: 0;
        }

        #green-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        #green-canvas img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>
<body>
    <main class="rbx-greenscreen-content" id="green-canvas">
        <img
            src="https://c.top4top.io/p_3948hewu71.png"
            alt="Tampilan Roblox"
        >
    </main>

    <script src="app.js"></script>
</body>
</html>
